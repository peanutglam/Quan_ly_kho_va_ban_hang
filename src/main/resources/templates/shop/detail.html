<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title th:text="${product.name} + ' - Cửa hàng'">Chi tiết sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root{--primary:#7c3aed} body{background:#f8f7ff;font-family:'Segoe UI',sans-serif}
    .navbar-shop{background:var(--primary)} .navbar-shop a{color:#fff!important}
    .product-box{background:#fff;border-radius:18px;box-shadow:0 2px 16px rgba(124,58,237,.1);padding:40px}
    .price{color:var(--primary);font-size:2rem;font-weight:800}
    .btn-add{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-weight:600}
    .btn-add:hover{background:#6d28d9;color:#fff}
  </style>
</head>
<body>
<nav class="navbar navbar-shop shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/shop}"><i class="fa fa-store me-2"></i>Cửa hàng</a>
    <a th:href="@{/cart}" class="btn btn-outline-light btn-sm"><i class="fa fa-shopping-cart me-1"></i>Giỏ hàng</a>
  </div>
</nav>
<div class="container py-4" style="max-width:720px;">
  <a th:href="@{/shop}" class="btn btn-outline-secondary btn-sm mb-4"><i class="fa fa-arrow-left me-1"></i>Quay lại</a>
  <div class="product-box">
    <small class="text-muted" th:text="${product.category ?: 'Mỹ phẩm'}">Danh mục</small>
    <h2 class="fw-bold mt-1 mb-1" th:text="${product.name}">Tên sản phẩm</h2>
    <p class="text-muted" th:text="${product.brand ?: ''}"></p>
    <div class="price mb-3" th:text="${#numbers.formatDecimal(product.salePrice,0,'COMMA',0,'POINT')} + ' đ'">0đ</div>
    <span class="badge mb-3"
          th:classappend="${product.quantity > 5} ? 'bg-success' : (${product.quantity > 0} ? 'bg-warning text-dark' : 'bg-danger')"
          th:text="${product.quantity > 0} ? ('Còn ' + product.quantity + ' sản phẩm') : 'Hết hàng'">Tồn kho</span>
    <p class="mb-4" th:text="${product.description ?: ''}"></p>
    <form th:action="@{/cart/add}" method="post" th:if="${product.quantity > 0}" class="d-flex gap-3 align-items-center">
      <input type="hidden" name="productId" th:value="${product.id}"/>
      <input type="number" name="quantity" value="1" min="1" th:max="${product.quantity}"
             class="form-control" style="width:80px;border-radius:8px"/>
      <button type="submit" class="btn-add btn"><i class="fa fa-cart-plus me-2"></i>Thêm vào giỏ</button>
    </form>
    <button disabled class="btn btn-secondary" th:unless="${product.quantity > 0}">Hết hàng</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
