<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product != null ? product.name : 'Chi tiết sản phẩm'}">Chi tiết sản phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="shop-page">

<header class="shop-header">
    <div class="shop-header-inner">
        <a th:href="@{/shop}" class="shop-brand">
            <span class="shop-brand-badge">PG</span>
            <span th:text="${(shopProfile != null and shopProfile.shopName != null and !#strings.isEmpty(shopProfile.shopName)) ? shopProfile.shopName : 'peanutglam'}">peanutglam</span>
        </a>

        <div class="shop-actions">
            <a th:href="@{/shop}" class="shop-action-btn">← Cửa hàng</a>
            <a th:href="@{/cart}" class="shop-action-btn">🛒 Giỏ hàng</a>
        </div>
    </div>
</header>

<main class="detail-shell">
    <a th:href="@{/shop}" class="shop-action-btn mb-4">← Quay lại danh sách</a>

    <div class="detail-card">
        <div class="row g-4 align-items-start">
            <div class="col-lg-5">
                <div class="product-thumb" style="height: 420px; font-size: 110px;">🛍️</div>
            </div>

            <div class="col-lg-7">
                <span class="product-category" th:text="${product.category != null and !#strings.isEmpty(product.category) ? product.category : 'Mỹ phẩm'}">Mỹ phẩm</span>

                <h1 class="fw-bold mt-3 mb-2" style="color: var(--heading); letter-spacing:-0.8px;" th:text="${product.name}">Tên sản phẩm</h1>

                <p class="text-muted mb-3" th:text="${product.brand != null and !#strings.isEmpty(product.brand) ? product.brand : 'Chưa xác định thương hiệu'}">Thương hiệu</p>

                <div class="detail-price mb-3" th:text="${#numbers.formatDecimal(product.salePrice == null ? 0 : product.salePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>

                <span class="stock-badge" th:text="${product.quantity != null and product.quantity > 0 ? 'Còn ' + product.quantity + ' sản phẩm' : 'Hết hàng'}">Còn hàng</span>

                <div class="mt-4 mb-4">
                    <h5 class="fw-bold">Mô tả sản phẩm</h5>
                    <p class="text-muted" th:text="${product.description != null and !#strings.isEmpty(product.description) ? product.description : 'Sản phẩm hiện chưa có mô tả chi tiết.'}">Mô tả sản phẩm</p>
                </div>

                <form th:action="@{/cart/add}" method="post" th:if="${product.quantity != null and product.quantity > 0}" class="d-flex flex-wrap gap-3 align-items-center">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="number" name="quantity" value="1" min="1" th:max="${product.quantity}" class="form-control" style="max-width: 120px;">
                    <button type="submit" class="btn btn-primary">🛒 Thêm vào giỏ</button>
                </form>

                <button disabled class="btn btn-light" th:if="${product.quantity == null or product.quantity <= 0}">Hết hàng</button>
            </div>
        </div>
    </div>
</main>

<footer class="shop-footer"><p class="mb-0">Cảm ơn bạn đã ghé thăm cửa hàng.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
