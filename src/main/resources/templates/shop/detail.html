<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' | ' + ${shopProfile != null ? shopProfile.displayShopName : 'Cửa hàng'}">
        Chi tiết sản phẩm
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="shop-page"
      th:with="mainColor=${shopProfile != null ? shopProfile.displayThemeColor : '#dc6b98'}">

<header class="shop-header">
    <div class="shop-header-inner">
        <a th:href="@{/shop}" class="shop-brand">
            <span class="shop-brand-badge"
                  th:style="'background:' + ${mainColor}">
                🛍️
            </span>

            <span th:text="${shopProfile != null ? shopProfile.displayShopName : 'SmartInventory Store'}">
                SmartInventory Store
            </span>
        </a>

        <div class="shop-actions">
            <a th:href="@{/shop}" class="shop-action-btn">
                ← Cửa hàng
            </a>

            <a th:href="@{/cart}" class="shop-action-btn">
                🛒 Giỏ hàng
            </a>
        </div>
    </div>
</header>

<main class="detail-shell">

    <a th:href="@{/shop}" class="btn btn-light btn-soft mb-4">
        ← Quay lại cửa hàng
    </a>

    <section class="detail-card">
        <div class="row g-4 align-items-start">

            <div class="col-lg-6">
                <div th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                     style="width: 100%; min-height: 480px; border-radius: 28px; overflow: hidden; background: #fff0f6; border: 1px solid #f1d4df;">
                    <img th:src="${product.imageUrl}"
                         th:alt="${product.name}"
                         style="width: 100%; height: 480px; object-fit: cover;"
                         onerror="this.closest('div').style.display='none'">
                </div>

                <div th:if="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}"
                     style="width: 100%; height: 480px; border-radius: 28px; display: grid; place-items: center; background: linear-gradient(135deg,#fff0f6,#ffe3ef); color: #c84f80; font-size: 100px; border: 1px solid #f1d4df;">
                    🌸
                </div>
            </div>

            <div class="col-lg-6">
                <div class="product-category mb-3"
                     th:text="${product.category != null and !#strings.isEmpty(product.category) ? product.category : 'Mỹ phẩm'}">
                    Mỹ phẩm
                </div>

                <h1 class="fw-bold mb-2"
                    style="font-size: 42px; color: #2e202e;"
                    th:text="${product.name}">
                    Tên sản phẩm
                </h1>

                <p class="text-muted fs-5 mb-3"
                   th:text="${product.brand != null and !#strings.isEmpty(product.brand) ? product.brand : 'Chưa xác định thương hiệu'}">
                    Brand
                </p>

                <div th:if="${product.promotionCurrentlyActive}" class="mb-2">
                    <span class="badge rounded-pill" style="background:#e63972; color:white; padding:9px 14px;">
                        Đang sale <span th:text="${#numbers.formatDecimal(product.discountPercentDisplay, 0, 'COMMA', 0, 'POINT')} + '%'">0%</span>
                    </span>
                </div>

                <div class="detail-price mb-1" th:style="'color:' + ${mainColor}">
                    <span th:text="${#numbers.formatDecimal(product.effectiveSalePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                </div>

                <div th:if="${product.promotionCurrentlyActive}" class="text-muted mb-3 fs-5">
                    Giá gốc:
                    <span style="text-decoration: line-through;"
                          th:text="${#numbers.formatDecimal(product.salePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                </div>

                <div class="mb-4">
                    <span class="badge"
                          th:classappend="${product.quantity != null and product.quantity > 5} ? 'bg-success' : (${product.quantity != null and product.quantity > 0} ? 'bg-warning text-dark' : 'bg-danger')"
                          th:text="${product.quantity != null and product.quantity > 0 ? 'Còn ' + product.quantity + ' sản phẩm' : 'Hết hàng'}">
                        Tồn kho
                    </span>
                </div>

                <div class="p-4 rounded-4 mb-4"
                     style="background: #fff8fb; border: 1px solid #f1d4df;">
                    <h5 class="fw-bold mb-2">Mô tả sản phẩm</h5>

                    <p class="mb-0 text-muted"
                       style="line-height: 1.8;"
                       th:text="${product.description != null and !#strings.isEmpty(product.description) ? product.description : 'Sản phẩm hiện chưa có mô tả chi tiết.'}">
                        Mô tả sản phẩm
                    </p>
                </div>

                <form th:action="@{/cart/add}"
                      method="post"
                      th:if="${product.quantity != null and product.quantity > 0}"
                      class="d-flex gap-3 align-items-center flex-wrap">

                    <input type="hidden" name="productId" th:value="${product.id}">

                    <div>
                        <label class="form-label fw-bold">Số lượng</label>
                        <input type="number"
                               name="quantity"
                               value="1"
                               min="1"
                               th:max="${product.quantity}"
                               class="form-control"
                               style="width: 110px;">
                    </div>

                    <div class="flex-grow-1">
                        <label class="form-label fw-bold d-none d-md-block">&nbsp;</label>

                        <button type="submit"
                                class="btn btn-primary w-100"
                                th:style="'background:' + ${mainColor}">
                            🛒 Thêm vào giỏ hàng
                        </button>
                    </div>
                </form>

                <button disabled
                        class="btn btn-secondary w-100"
                        th:if="${product.quantity == null or product.quantity <= 0}">
                    Sản phẩm đã hết hàng
                </button>

                <div class="mt-4 text-muted"
                     th:if="${shopProfile != null and shopProfile.phone != null and !#strings.isEmpty(shopProfile.phone)}">
                    Cần tư vấn?
                    <b>Liên hệ:</b>
                    <span th:text="${shopProfile.phone}">Hotline</span>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="shop-footer">
    <span th:text="${shopProfile != null ? shopProfile.displayShopName : 'SmartInventory Store'}">
        SmartInventory Store
    </span>
</footer>

</body>
</html>
