<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${shopProfile?.shopName ?: 'Cửa hàng'} + ' - Mua sắm'">Cửa hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { --primary: #7c3aed; --primary-light: #ede9fe; }
    body { background: #f8f7ff; font-family: 'Segoe UI', sans-serif; }
    .shop-navbar { background: var(--primary); }
    .shop-navbar .navbar-brand { color: #fff !important; font-weight: 700; font-size: 1.3rem; }
    .shop-navbar .nav-link { color: rgba(255,255,255,.85) !important; }
    .shop-navbar .nav-link:hover { color: #fff !important; }
    .product-card { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(124,58,237,.08);
      transition: transform .2s, box-shadow .2s; background: #fff; height: 100%; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(124,58,237,.18); }
    .product-card .badge-category { background: var(--primary-light); color: var(--primary);
      font-size: .72rem; border-radius: 6px; padding: 2px 8px; }
    .product-card .price { color: var(--primary); font-weight: 700; font-size: 1.15rem; }
    .product-card .old-price { color: #aaa; text-decoration: line-through; font-size: .88rem; }
    .btn-add { background: var(--primary); color: #fff; border: none; border-radius: 8px; width: 100%; }
    .btn-add:hover { background: #6d28d9; color: #fff; }
    .cart-btn { background: #fff; border: 2px solid #fff; border-radius: 8px; color: var(--primary);
      font-weight: 600; padding: 6px 18px; }
    .cart-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary-light); }
    .hero { background: linear-gradient(135deg, var(--primary) 0%, #a78bfa 100%);
      color: #fff; padding: 48px 0 36px; text-align: center; margin-bottom: 32px; }
    .hero h1 { font-size: 2.2rem; font-weight: 800; }
    .stock-badge { font-size: .75rem; }
  </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg shop-navbar shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand" th:href="@{/shop}">
      <i class="fa fa-store me-2"></i>
      <span th:text="${shopProfile?.shopName ?: 'SmartInventory Shop'}">Shop</span>
    </a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <a th:href="@{/cart}" class="cart-btn btn position-relative">
        <i class="fa fa-shopping-cart me-1"></i>Giỏ hàng
      </a>
      <a th:href="@{/login}" class="btn btn-outline-light btn-sm">
        <i class="fa fa-lock me-1"></i>Quản trị
      </a>
    </div>
  </div>
</nav>

<!-- Hero -->
<div class="hero">
  <div class="container">
    <h1 th:text="${shopProfile?.shopName ?: 'Cửa hàng mỹ phẩm'}">Cửa hàng mỹ phẩm</h1>
    <p class="mb-0 opacity-75" th:text="${shopProfile?.address ?: ''}"></p>
    <form th:action="@{/shop}" method="get" class="mt-4 d-flex justify-content-center gap-2">
      <input type="text" name="q" class="form-control" style="max-width:360px;border-radius:8px;"
             th:value="${keyword}" placeholder="Tìm sản phẩm..."/>
      <button class="btn btn-light fw-bold px-4">Tìm</button>
    </form>
  </div>
</div>

<div class="container pb-5">
  <!-- Lọc category -->
  <div class="d-flex flex-wrap gap-2 mb-4" th:if="${!categories.isEmpty()}">
    <a th:href="@{/shop(q=${keyword})}" class="btn btn-sm"
       th:classappend="${selectedCategory == null} ? 'btn-primary' : 'btn-outline-primary'">Tất cả</a>
    <a th:each="cat : ${categories}" th:href="@{/shop(q=${keyword}, category=${cat})}"
       th:text="${cat}" class="btn btn-sm"
       th:classappend="${cat == selectedCategory} ? 'btn-primary' : 'btn-outline-primary'">Loại</a>
  </div>

  <!-- Thông báo -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible" role="alert">
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${warnMessage}" class="alert alert-warning alert-dismissible" role="alert">
    <span th:text="${warnMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible" role="alert">
    <span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Danh sách sản phẩm -->
  <div th:if="${products.isEmpty()}" class="text-center py-5 text-muted">
    <i class="fa fa-box-open fa-3x mb-3 d-block"></i>
    <p>Không tìm thấy sản phẩm nào.</p>
    <a th:href="@{/shop}" class="btn btn-outline-primary">Xem tất cả</a>
  </div>

  <div class="row g-4" th:unless="${products.isEmpty()}">
    <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
      <div class="product-card card p-3 d-flex flex-column">
        <div class="mb-2">
          <span class="badge-category" th:text="${product.category ?: 'Mỹ phẩm'}">Mỹ phẩm</span>
        </div>
        <div class="flex-grow-1">
          <h6 class="mb-1 fw-semibold" th:text="${product.name}">Tên sản phẩm</h6>
          <small class="text-muted" th:text="${product.brand ?: ''}"></small>
        </div>
        <div class="mt-2 mb-3">
          <div class="price" th:text="${#numbers.formatDecimal(product.salePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
          <span class="badge stock-badge"
                th:classappend="${product.quantity > 5} ? 'bg-success' : (${product.quantity > 0} ? 'bg-warning text-dark' : 'bg-danger')"
                th:text="${product.quantity > 0} ? ('Còn ' + product.quantity) : 'Hết hàng'">Còn hàng</span>
        </div>
        <form th:action="@{/cart/add}" method="post" th:if="${product.quantity > 0}">
          <input type="hidden" name="productId" th:value="${product.id}"/>
          <input type="hidden" name="quantity" value="1"/>
          <button type="submit" class="btn-add btn">
            <i class="fa fa-cart-plus me-1"></i>Thêm giỏ
          </button>
        </form>
        <button class="btn btn-secondary btn-sm w-100" disabled th:unless="${product.quantity > 0}">Hết hàng</button>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="text-center py-4 border-top mt-4 text-muted small">
  <p th:text="${shopProfile?.shopName ?: 'SmartInventory'} + ' - ' + (${shopProfile?.phone ?: ''})"></p>
  <p th:text="${shopProfile?.address ?: ''}"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
