<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản của tôi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#fff4fa;">
<div class="container py-5">
    <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 900px;">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Tài khoản của tôi</h2>
                    <p class="text-muted mb-0">
                        Xin chào,
                        <b th:text="${customer.fullName}">Khách hàng</b>
                    </p>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <a class="btn btn-outline-secondary" th:href="@{/shop}">← Về cửa hàng</a>
                    <a class="btn btn-outline-danger" th:href="@{/customer/logout}">Đăng xuất</a>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="row g-3">
                <div class="col-md-6">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Họ tên</div>
                        <div class="fw-bold" th:text="${customer.fullName}">Tên khách hàng</div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Tên đăng nhập</div>
                        <div class="fw-bold" th:text="${customer.username}">username</div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Email</div>
                        <div class="fw-bold" th:text="${customer.email != null ? customer.email : '-'}">-</div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Số điện thoại</div>
                        <div class="fw-bold" th:text="${customer.phone != null ? customer.phone : '-'}">-</div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Địa chỉ</div>
                        <div class="fw-bold" th:text="${customer.address != null ? customer.address : '-'}">-</div>
                    </div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <a class="btn btn-primary" th:href="@{/customer/orders}">
                    Lịch sử đơn hàng
                </a>

                <a class="btn btn-outline-primary" th:href="@{/customer/profile}">
                    Cập nhật thông tin cá nhân
                </a>

                <a class="btn btn-light border" th:href="@{/cart}">
                    Giỏ hàng
                </a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
