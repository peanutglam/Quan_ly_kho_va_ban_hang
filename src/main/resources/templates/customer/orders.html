<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử đơn hàng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#fff4fa;">
<div class="container py-5">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Lịch sử đơn hàng</h2>
                    <p class="text-muted mb-0">Xem các đơn hàng bạn đã đặt và trạng thái xử lý.</p>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <a class="btn btn-outline-secondary" th:href="@{/customer/account}">← Tài khoản</a>
                    <a class="btn btn-primary" th:href="@{/shop}">Tiếp tục mua hàng</a>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Ngày đặt</th>
                        <th>Khách hàng</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${orders == null or #lists.isEmpty(orders)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            Bạn chưa có đơn hàng nào.
                        </td>
                    </tr>

                    <tr th:each="o : ${orders}">
                        <td>
                            <b th:text="${o.orderCode}">ORD001</b>
                        </td>

                        <td th:text="${o.createdAt != null ? #temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">
                            -
                        </td>

                        <td th:text="${o.customerName != null ? o.customerName : '-'}">
                            -
                        </td>

                        <td th:text="${#numbers.formatDecimal(o.totalBill, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            0 đ
                        </td>

                        <td>
                            <span class="badge bg-light text-dark border"
                                  th:text="${o.statusDisplayName}">
                                Trạng thái
                            </span>
                        </td>

                        <td>
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/customer/orders/{id}(id=${o.id})}">
                                Xem chi tiết
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-center mt-4"
                 th:if="${totalPages != null and totalPages > 1}">
                <nav>
                    <ul class="pagination">
                        <li class="page-item" th:if="${currentPage > 0}">
                            <a class="page-link" th:href="@{/customer/orders(page=${currentPage - 1})}">
                                Trước
                            </a>
                        </li>

                        <li class="page-item active">
                            <span class="page-link" th:text="${currentPage + 1}">1</span>
                        </li>

                        <li class="page-item" th:if="${currentPage + 1 < totalPages}">
                            <a class="page-link" th:href="@{/customer/orders(page=${currentPage + 1})}">
                                Sau
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
</div>
</body>
</html>
