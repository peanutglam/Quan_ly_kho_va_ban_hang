<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật thông tin cá nhân</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#fff4fa;">
<div class="container py-5">
    <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 900px;">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Cập nhật thông tin cá nhân</h2>
                    <p class="text-muted mb-0">Thay đổi thông tin nhận hàng và mật khẩu.</p>
                </div>

                <a class="btn btn-outline-secondary" th:href="@{/customer/account}">
                    ← Tài khoản của tôi
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form method="post" th:action="@{/customer/profile}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Họ tên</label>
                        <input class="form-control" name="fullName" th:value="${customer.fullName}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tên đăng nhập</label>
                        <input class="form-control" th:value="${customer.username}" disabled>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input class="form-control" type="email" name="email" th:value="${customer.email}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Số điện thoại</label>
                        <input class="form-control" name="phone" th:value="${customer.phone}">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Địa chỉ</label>
                        <input class="form-control" name="address" th:value="${customer.address}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Mật khẩu hiện tại</label>
                        <input class="form-control" type="password" name="currentPassword" autocomplete="current-password">
                        <div class="form-text">Chỉ nhập nếu muốn đổi mật khẩu.</div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Mật khẩu mới</label>
                        <input class="form-control" type="password" name="newPassword" autocomplete="new-password">
                        <div class="form-text">Tối thiểu 6 ký tự.</div>
                    </div>
                </div>

                <button class="btn btn-primary mt-4" type="submit">
                    Lưu thay đổi
                </button>
            </form>

        </div>
    </div>
</div>
</body>
</html>
