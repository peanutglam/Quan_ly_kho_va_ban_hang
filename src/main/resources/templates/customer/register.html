<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký khách hàng</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="app-bg">
<div class="page-container" style="max-width: 760px;">
  <section class="page-card">
    <h2 class="fw-bold mb-2">Đăng ký tài khoản khách hàng</h2>
    <p class="text-muted">Tạo tài khoản để theo dõi lịch sử đơn hàng.</p>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form method="post" th:action="@{/customer/register}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Họ tên</label>
          <input class="form-control" name="fullName" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Tên đăng nhập</label>
          <input class="form-control" name="username" required autocomplete="username">
        </div>

        <div class="col-md-6">
          <label class="form-label">Mật khẩu</label>
          <input class="form-control" type="password" name="password" minlength="6" required autocomplete="new-password">
        </div>

        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email">
        </div>

        <div class="col-md-6">
          <label class="form-label">Số điện thoại</label>
          <input class="form-control" name="phone">
        </div>

        <div class="col-md-6">
          <label class="form-label">Địa chỉ</label>
          <input class="form-control" name="address">
        </div>
      </div>

      <button class="btn btn-primary w-100 mt-4" type="submit">Đăng ký</button>
    </form>

    <div class="mt-3 d-flex justify-content-between">
      <a th:href="@{/shop}">← Về cửa hàng</a>
      <a th:href="@{/customer/login}">Đã có tài khoản?</a>
    </div>
  </section>
</div>
</body>
</html>
