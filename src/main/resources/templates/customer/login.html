<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập khách hàng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="app-bg">
<div class="page-container" style="max-width: 620px;">
    <section class="page-card">
        <h2 class="fw-bold mb-2">Đăng nhập khách hàng</h2>
        <p class="text-muted">Đăng nhập để xem lịch sử đơn hàng và trạng thái đơn.</p>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form method="post" th:action="@{/customer/login}">
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input class="form-control" name="username" required autocomplete="username">
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input class="form-control" type="password" name="password" required autocomplete="current-password">
            </div>

            <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
        </form>

        <div class="mt-3 d-flex justify-content-between">
            <a th:href="@{/shop}">← Về cửa hàng</a>
            <a th:href="@{/customer/register}">Đăng ký tài khoản</a>
        </div>
    </section>
</div>
</body>
</html>
