<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#fff4fa;">
<div class="container py-5">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Chi tiết đơn hàng</h2>
                    <p class="text-muted mb-0">
                        Mã đơn:
                        <b th:text="${order.orderCode}">ORD001</b>
                    </p>
                </div>

                <a class="btn btn-outline-secondary" th:href="@{/customer/orders}">
                    ← Lịch sử đơn hàng
                </a>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Trạng thái</div>
                        <div class="fw-bold" th:text="${order.statusDisplayName}">CHỜ_XÁC_NHẬN</div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Tổng tiền</div>
                        <div class="fw-bold" th:text="${#numbers.formatDecimal(order.totalBill, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            0 đ
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Khách cọc</div>
                        <div class="fw-bold" th:text="${#numbers.formatDecimal(order.customerDeposit, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            0 đ
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="p-3 rounded-4 border bg-light">
                        <div class="text-muted small">Còn phải thu</div>
                        <div class="fw-bold" th:text="${#numbers.formatDecimal(order.remainingAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                            0 đ
                        </div>
                    </div>
                </div>
            </div>

            <h5 class="fw-bold">Thông tin nhận hàng</h5>
            <div class="p-3 rounded-4 border bg-light mb-4">
                <div>
                    <b th:text="${order.customerName != null ? order.customerName : '-'}">Tên khách</b>
                </div>

                <div>
                    SĐT:
                    <span th:text="${order.customerPhone != null ? order.customerPhone : '-'}">-</span>
                </div>

                <div>
                    Địa chỉ:
                    <span th:text="${order.customerAddress != null ? order.customerAddress : '-'}">-</span>
                </div>
            </div>

            <h5 class="fw-bold">Sản phẩm trong đơn</h5>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Số lượng</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${order.items == null or #lists.isEmpty(order.items)}">
                        <td colspan="2" class="text-center text-muted py-4">
                            Đơn hàng chưa có chi tiết sản phẩm.
                        </td>
                    </tr>

                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.product != null ? item.product.name : 'Sản phẩm'}">
                            Sản phẩm
                        </td>

                        <td th:text="${item.quantity}">
                            1
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
</body>
</html>
