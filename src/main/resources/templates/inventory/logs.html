<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lịch sử thao tác kho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .inventory-log-page .log-table-wrap {
      border: 1px solid #f2d4df;
      border-radius: 24px;
      overflow: hidden;
      background: #fff;
    }

    .inventory-log-page .log-table {
      margin-bottom: 0;
      min-width: 1050px;
    }

    .inventory-log-page .log-table thead th {
      background: #f8c8dc;
      color: #7f3158;
      font-weight: 800;
      border-color: #f2b8cf;
      padding: 16px 14px;
      white-space: nowrap;
    }

    .inventory-log-page .log-table tbody td {
      padding: 16px 14px;
      vertical-align: middle;
      color: #352838;
      border-color: #f5dbe5;
      line-height: 1.45;
    }

    .inventory-log-page .log-time {
      white-space: nowrap;
      font-weight: 650;
    }

    .inventory-log-page .log-actor {
      white-space: nowrap;
      font-weight: 650;
    }

    .inventory-log-page .log-product {
      min-width: 240px;
      font-weight: 650;
    }

    .inventory-log-page .log-description {
      min-width: 360px;
      color: #4a3a49;
    }

    .inventory-log-page .action-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      background: #fff;
      color: #333;
      border: 1px solid #dde2e7;
      white-space: nowrap;
    }

    .inventory-log-page .action-import {
      background: #ecfdf3;
      color: #087443;
      border-color: #b7ebc8;
    }

    .inventory-log-page .action-sale {
      background: #fff7ed;
      color: #b45309;
      border-color: #fed7aa;
    }

    .inventory-log-page .action-cancel {
      background: #eef2ff;
      color: #4338ca;
      border-color: #c7d2fe;
    }

    .inventory-log-page .action-check {
      background: #fdf2f8;
      color: #be185d;
      border-color: #fbcfe8;
    }

    .inventory-log-page .empty-log {
      padding: 50px 18px !important;
      text-align: center;
      color: #8a7380 !important;
      font-weight: 650;
    }
  </style>
</head>

<body class="app-bg inventory-log-page">
<div class="page-container page-wide">

  <div class="page-top-actions mb-3">
    <a class="btn btn-light btn-soft" th:href="@{/dashboard}">← Về Dashboard</a>

    <a th:if="${canInventoryCheck == true}"
       class="btn btn-outline-primary"
       th:href="@{/inventory-checks}">
      Kiểm kê kho
    </a>
  </div>

  <section class="page-card">
    <h2 class="fw-bold mb-1">Lịch sử thao tác kho</h2>
    <p class="text-muted mb-4">
      Theo dõi nhập hàng, bán hàng, hủy đơn, kiểm kê và điều chỉnh tồn kho.
    </p>

    <div class="table-responsive log-table-wrap">
      <table class="table table-hover align-middle log-table">
        <thead>
        <tr>
          <th>Thời gian</th>
          <th>Người thao tác</th>
          <th>Hành động</th>
          <th>Sản phẩm</th>
          <th>Ghi chú</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${logs == null or #lists.isEmpty(logs)}">
          <td colspan="5" class="empty-log">
            Chưa có lịch sử thao tác kho.
          </td>
        </tr>

        <tr th:each="log : ${logs}">
          <td class="log-time"
              th:text="${log.createdAt != null ? #temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">
            -
          </td>

          <td class="log-actor" th:text="${log.actorName}">
            -
          </td>

          <td>
            <span class="action-badge"
                  th:classappend="${
                    log.actionType == 'IMPORT' ? ' action-import' :
                    (log.actionType == 'ORDER_CREATE' or log.actionType == 'ORDER_REOPEN' ? ' action-sale' :
                    (log.actionType == 'ORDER_CANCEL' or log.actionType == 'ORDER_DELETE' ? ' action-cancel' :
                    (log.actionType == 'INVENTORY_CHECK' ? ' action-check' : '')))
                  }"
                  th:text="${log.actionDisplayName}">
              Hành động
            </span>
          </td>

          <td class="log-product" th:text="${log.productName}">
            Sản phẩm
          </td>

          <td class="log-description" th:text="${log.description != null ? log.description : '-'}">
            -
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${totalPages != null and totalPages > 1}"
         class="d-flex justify-content-center mt-4">
      <nav>
        <ul class="pagination mb-0">
          <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/inventory-logs(page=${currentPage - 1})}">
              Trước
            </a>
          </li>

          <li class="page-item"
              th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link"
               th:href="@{/inventory-logs(page=${i})}"
               th:text="${i + 1}">
              1
            </a>
          </li>

          <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
            <a class="page-link" th:href="@{/inventory-logs(page=${currentPage + 1})}">
              Sau
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </section>
</div>
</body>
</html>
