<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Không thể xử lý yêu cầu | SmartInventory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="error-page">

<main class="error-card">
    <div class="error-code" th:text="${status != null ? status : '500'}">500</div>
    <h1 th:text="${errorTitle != null ? errorTitle : 'Không thể xử lý yêu cầu'}">Không thể xử lý yêu cầu</h1>
    <p class="text-muted mb-0">Rất tiếc, hệ thống chưa thể hoàn tất thao tác này. Bạn có thể quay lại cửa hàng hoặc đăng nhập khu vực quản trị để tiếp tục.</p>

    <div class="error-details">
        <div class="error-detail-row">
            <strong>Thông báo:</strong>
            <span th:text="${message != null ? message : 'Vui lòng quay lại và thử lại sau.'}">Vui lòng quay lại và thử lại sau.</span>
        </div>
        <div class="error-detail-row" th:if="${path != null}">
            <strong>Đường dẫn:</strong>
            <span th:text="${path}">/path</span>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a class="btn btn-primary" th:href="@{/shop}">Về cửa hàng</a>
        <a class="btn btn-light" th:href="@{/login}">Đăng nhập Owner</a>
        <a class="btn btn-soft" th:href="@{/dashboard}">Dashboard</a>
    </div>
</main>

</body>
</html>
