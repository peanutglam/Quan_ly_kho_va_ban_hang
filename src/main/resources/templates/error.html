<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lỗi hệ thống</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="error-page">

<div class="error-card">
    <div class="mb-3" style="font-size: 56px;">🌸</div>

    <h1>Không thể xử lý yêu cầu</h1>

    <p class="text-muted mb-2">
        Mã lỗi:
        <b th:text="${status != null ? status : '500'}">500</b>
    </p>

    <div class="error-message" th:text="${message != null ? message : 'Hệ thống đang gặp lỗi. Vui lòng thử lại sau.'}">
        Hệ thống đang gặp lỗi.
    </div>

    <p class="text-muted">
        Đường dẫn:
        <span th:text="${path != null ? path : ''}"></span>
    </p>

    <div class="d-flex gap-2 flex-wrap mt-4">
        <a th:href="@{/shop}" class="btn btn-primary">Về cửa hàng</a>
        <a th:href="@{/login}" class="btn btn-light">Đăng nhập Owner</a>
        <a th:href="@{/dashboard}" class="btn btn-light">Về Dashboard</a>
    </div>
</div>

</body>
</html>
