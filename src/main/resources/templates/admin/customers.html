<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khách hàng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="app-bg">
<div class="page-container page-wide">
    <section class="page-card">
        <div class="page-top-actions mb-3">
            <a class="btn btn-light btn-soft" th:href="@{/dashboard}">← Dashboard</a>
        </div>

        <h2 class="fw-bold">Quản lý khách hàng</h2>
        <p class="text-muted">Chỉ Owner mới xem được danh sách khách hàng đăng ký.</p>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Tên đăng nhập</th>
                    <th>Email</th>
                    <th>SĐT</th>
                    <th>Địa chỉ</th>
                    <th>Trạng thái</th>
                    <th>Ngày tạo</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${customers == null or #lists.isEmpty(customers)}">
                    <td colspan="9" class="text-center text-muted py-5">Chưa có khách hàng đăng ký.</td>
                </tr>

                <tr th:each="c : ${customers}">
                    <td th:text="${c.id}">1</td>
                    <td><b th:text="${c.fullName}">Tên</b></td>
                    <td th:text="${c.username}">username</td>
                    <td th:text="${c.email != null ? c.email : '-'}">-</td>
                    <td th:text="${c.phone != null ? c.phone : '-'}">-</td>
                    <td th:text="${c.address != null ? c.address : '-'}">-</td>
                    <td>
                        <span class="badge"
                              th:classappend="${c.active == true} ? ' bg-success' : ' bg-secondary'"
                              th:text="${c.active == true ? 'Đang hoạt động' : 'Đã khóa'}">
                            Trạng thái
                        </span>
                    </td>
                    <td th:text="${c.createdAt != null ? #temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/customers/{id}(id=${c.id})}">
                            Chi tiết
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
