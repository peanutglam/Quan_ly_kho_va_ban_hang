<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Giỏ hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root { --primary: #7c3aed; }
    body { background: #f8f7ff; font-family: 'Segoe UI', sans-serif; }
    .navbar-shop { background: var(--primary); }
    .navbar-shop .navbar-brand, .navbar-shop a { color: #fff !important; }
    .card-cart { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(124,58,237,.1); }
    .qty-input { width: 70px; text-align: center; border-radius: 6px; border: 1.5px solid #ddd; }
    .btn-primary-purple { background: var(--primary); color: #fff; border: none; border-radius: 8px; }
    .btn-primary-purple:hover { background: #6d28d9; color: #fff; }
    .total-box { background: linear-gradient(135deg,var(--primary) 0%,#a78bfa 100%);
      color: #fff; border-radius: 14px; padding: 24px; }
  </style>
</head>
<body>
<nav class="navbar navbar-shop shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/shop}"><i class="fa fa-store me-2"></i>Cửa hàng</a>
    <a th:href="@{/shop}" class="btn btn-outline-light btn-sm"><i class="fa fa-arrow-left me-1"></i>Tiếp tục mua</a>
  </div>
</nav>

<div class="container pb-5" style="max-width:900px;">
  <h4 class="fw-bold mb-4"><i class="fa fa-shopping-cart me-2" style="color:var(--primary)"></i>Giỏ hàng của bạn</h4>

  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <div th:if="${warnMessage}" class="alert alert-warning" th:text="${warnMessage}"></div>

  <!-- Giỏ trống -->
  <div th:if="${cartItems.isEmpty()}" class="text-center py-5">
    <i class="fa fa-shopping-cart fa-4x mb-3 d-block text-muted"></i>
    <p class="text-muted">Giỏ hàng trống. <a th:href="@{/shop}">Chọn sản phẩm ngay!</a></p>
  </div>

  <!-- Danh sách sản phẩm -->
  <div th:unless="${cartItems.isEmpty()}">
    <div class="card card-cart mb-3 p-0 overflow-hidden">
      <table class="table table-borderless mb-0 align-middle">
        <thead class="table-light">
        <tr>
          <th>Sản phẩm</th>
          <th class="text-center">Số lượng</th>
          <th class="text-end">Đơn giá</th>
          <th class="text-end">Thành tiền</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cartItems}">
          <td>
            <div class="fw-semibold" th:text="${item.productName}">Tên SP</div>
            <small class="text-muted" th:text="${item.productCode}">Code</small>
          </td>
          <td class="text-center">
            <form th:action="@{/cart/update}" method="post" class="d-inline">
              <input type="hidden" name="productId" th:value="${item.productId}"/>
              <input type="number" name="quantity" class="qty-input form-control d-inline"
                     th:value="${item.quantity}" min="0" th:max="${item.maxStock}"
                     onchange="this.form.submit()"/>
            </form>
          </td>
          <td class="text-end" th:text="${#numbers.formatDecimal(item.unitPrice,0,'COMMA',0,'POINT')} + ' đ'">0đ</td>
          <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(item.subtotal,0,'COMMA',0,'POINT')} + ' đ'">0đ</td>
          <td class="text-center">
            <form th:action="@{/cart/remove}" method="post">
              <input type="hidden" name="productId" th:value="${item.productId}"/>
              <button class="btn btn-sm btn-outline-danger"><i class="fa fa-trash"></i></button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="row justify-content-end">
      <div class="col-md-5">
        <div class="total-box">
          <div class="d-flex justify-content-between mb-2">
            <span>Tổng cộng:</span>
            <strong class="fs-5" th:text="${#numbers.formatDecimal(cartTotal,0,'COMMA',0,'POINT')} + ' đ'">0đ</strong>
          </div>
          <a th:href="@{/checkout}" class="btn btn-light w-100 fw-bold mt-2">
            <i class="fa fa-credit-card me-2"></i>Đặt hàng ngay
          </a>
        </div>
        <div class="text-center mt-3">
          <form th:action="@{/cart/clear}" method="post">
            <button class="btn btn-sm btn-outline-secondary"><i class="fa fa-trash me-1"></i>Xóa giỏ hàng</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
