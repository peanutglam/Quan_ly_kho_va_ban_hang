<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đặt hàng thành công</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>:root{--primary:#7c3aed} body{background:#f8f7ff} .success-box{background:#fff;border-radius:18px;box-shadow:0 2px 24px rgba(124,58,237,.12);padding:52px 40px;text-align:center;max-width:480px;margin:80px auto}</style>
</head>
<body>
<div class="success-box">
  <div style="background:#ede9fe;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px">
    <i class="fa fa-check-circle fa-3x" style="color:var(--primary)"></i>
  </div>
  <h4 class="fw-bold mb-2">Đặt hàng thành công!</h4>
  <p class="text-muted">Mã đơn hàng của bạn:</p>
  <div class="badge fs-5 px-4 py-2 mb-4" style="background:var(--primary)" th:text="${orderCode}">ORD-XXXXX</div>
  <p class="text-muted small">Chúng tôi sẽ liên hệ xác nhận đơn hàng sớm nhất.<br/>Cảm ơn bạn đã mua hàng!</p>
  <a th:href="@{/shop}" class="btn btn-outline-secondary mt-3">
    <i class="fa fa-store me-2"></i>Tiếp tục mua sắm
  </a>
</div>
</body>
</html>
