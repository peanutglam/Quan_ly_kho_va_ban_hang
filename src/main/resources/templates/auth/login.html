<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập | SmartInventory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="auth-bg">
<div class="auth-shell">
  <div class="auth-card auth-card-wide">

    <div class="text-center mb-4">
      <div class="brand-logo mx-auto mb-3">SI</div>

      <h2>Đăng nhập hệ thống</h2>

      <p class="text-muted mb-0">
        Ứng dụng quản lý kho hàng và bán hàng cho cửa hàng mỹ phẩm.
      </p>
    </div>

    <div class="auth-note mb-3">
      Tài khoản Owner được cấp sẵn khi triển khai ứng dụng.
      Nhân viên đăng nhập bằng tài khoản do Owner tạo.
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/login}" method="post" autocomplete="off">

      <input type="text" style="display:none" autocomplete="username">
      <input type="password" style="display:none" autocomplete="current-password">

      <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>

        <input type="text"
               name="username"
               class="form-control"
               placeholder="Nhập tên đăng nhập"
               autocomplete="off"
               autocapitalize="off"
               spellcheck="false"
               readonly
               onfocus="this.removeAttribute('readonly');"
               required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>

        <input type="password"
               name="password"
               class="form-control"
               placeholder="Nhập mật khẩu"
               autocomplete="new-password"
               readonly
               onfocus="this.removeAttribute('readonly');"
               required>
      </div>

      <button class="btn btn-primary w-100" type="submit">
        Đăng nhập
      </button>
    </form>

    <div class="text-center mt-3 text-muted small">
      Nếu chưa có tài khoản, vui lòng liên hệ Owner hoặc người quản trị hệ thống.
    </div>

  </div>
</div>
</body>
</html>
